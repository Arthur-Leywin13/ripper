<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Jack the Ripper — Connexion</title>

  <style>
    :root {
      --accent: #8fc1f2;
      --text: #f2f5fa;
      --muted: #9fb3cc;
      --bg1: #05070d;
      --bg2: #151b2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          var(--bg1),
          var(--bg2)
        );

      color: var(--text);

      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 40px 20px;
    }

    h1 {
      letter-spacing: 4px;
      font-size: 22px;
      color: var(--accent);
      text-transform: uppercase;

      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;

      margin-bottom: 30px;

      text-align: center;
    }

    .card {
      background:
        rgba(8, 12, 22, 0.6);

      border:
        1px solid
        rgba(140, 180, 230, 0.3);

      border-radius: 24px;

      padding: 30px;

      width: 100%;
      max-width: 420px;

      text-align: center;
    }

    #qrBox {
      width: 260px;
      height: 260px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(255, 255, 255, 0.03);

      border-radius: 16px;

      overflow: hidden;
    }

    #qrBox img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;
    }

    #statusText {
      color: var(--muted);
      font-size: 14px;

      min-height: 20px;
    }

    .sessions {
      width: 100%;
      max-width: 420px;

      margin-top: 30px;
    }

    .sessions h2 {
      font-size: 15px;
      color: var(--muted);

      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 12px;

      text-align: center;
    }

    .session-row {
      display: flex;
      align-items: center;

      gap: 10px;

      background:
        rgba(255, 255, 255, 0.05);

      border-radius: 12px;

      padding: 12px 16px;

      margin-bottom: 8px;

      font-size: 15px;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #3ddc84;

      flex-shrink: 0;
    }

    .empty {
      color: var(--muted);

      font-size: 14px;

      text-align: center;

      padding: 10px;
    }

    .spinner {
      width: 36px;
      height: 36px;

      border:
        3px solid
        rgba(255, 255, 255, 0.15);

      border-top-color:
        var(--accent);

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      color: #ff7b7b;
    }
  </style>
</head>

<body>

  <h1>Jack the Ripper</h1>

  <div class="subtitle">
    Scanne ce QR avec WhatsApp pour connecter ton compte
    <br />
    (Appareils connectés → Lier un appareil)
  </div>

  <div class="card">

    <div id="qrBox">
      <div class="spinner"></div>
    </div>

    <div id="statusText">
      Génération du QR...
    </div>

  </div>

  <div class="sessions">

    <h2>Sessions connectées</h2>

    <div id="sessionsList">
      <div class="empty">
        Aucune pour l'instant
      </div>
    </div>

  </div>

  <script>
    let lastQr = null

    async function refreshQr() {
      try {
        const res = await fetch(
          '/api/qr' + location.search,
          {
            cache: 'no-store'
          }
        )

        if (!res.ok) {
          throw new Error(
            'HTTP ' + res.status
          )
        }

        const data = await res.json()

        console.log(
          '[QR]',
          data.status,
          'QR:',
          !!data.qr
        )

        const box =
          document.getElementById('qrBox')

        const statusText =
          document.getElementById(
            'statusText'
          )

        if (
          data.status === 'waiting' &&
          data.qr
        ) {
          if (data.qr !== lastQr) {
            box.innerHTML = ''

            const img =
              document.createElement('img')

            img.src = data.qr

            img.alt =
              'QR code WhatsApp'

            box.appendChild(img)

            lastQr = data.qr
          }

          statusText.textContent =
            'En attente de scan...'

        } else if (
          data.status === 'connected'
        ) {
          box.innerHTML =
            '<div class="spinner"></div>'

          statusText.textContent =
            'Connecté ! Génération d’un nouveau QR...'

          lastQr = null

        } else {
          box.innerHTML =
            '<div class="spinner"></div>'

          statusText.textContent =
            'Génération du QR...'
        }

      } catch (e) {
        console.error(
          '[QR] Erreur:',
          e
        )

        document.getElementById(
          'statusText'
        ).textContent =
          'Erreur de connexion au serveur.'
      }
    }

    async function refreshSessions() {
      try {
        const res = await fetch(
          '/api/sessions' + location.search,
          {
            cache: 'no-store'
          }
        )

        if (!res.ok) {
          throw new Error(
            'HTTP ' + res.status
          )
        }

        const list = await res.json()

        const el =
          document.getElementById(
            'sessionsList'
          )

        if (!list.length) {
          el.innerHTML =
            '<div class="empty">' +
            'Aucune pour l’instant' +
            '</div>'

          return
        }

        el.innerHTML = list
          .map(
            (s) =>
              '<div class="session-row">' +
              '<span class="dot"></span>' +
              '<span>' +
              s.phone +
              '</span>' +
              '</div>'
          )
          .join('')

      } catch (e) {
        console.error(
          '[Sessions] Erreur:',
          e
        )
      }
    }

    // Première vérification immédiate
    refreshQr()
    refreshSessions()

    // Vérifie le QR chaque seconde
    setInterval(
      refreshQr,
      1000
    )

    // Vérifie les sessions toutes les 5 secondes
    setInterval(
      refreshSessions,
      5000
    )
  </script>

</body>

</html>
